# The thing that gates other repos' reviews had no gate of its own.
#
# Nothing here needs docker or a token: the gates, the parsers, the anchoring and
# the container argv are all pure, which is why they are the part that is covered.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
