[project]
name = "robbie"
version = "0.1.0"
description = "Containerized PR pre-review agent: poll, gate, spawn, publish."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
# the mcp sidecars ship as their own images; this is for running them locally
mcp = ["mcp>=2.0", "uvicorn>=0.30"]
# the model proxy needs no MCP SDK — it forwards HTTP and swaps one header
proxy = ["uvicorn>=0.30", "starlette>=0.37"]
dev = [
    "pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4",
    "mypy>=1.10", "types-PyYAML",
    "mcp>=2.0", "uvicorn>=0.30", "starlette>=0.37",
]

[project.scripts]
robbie = "robbie.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Much of why this is safe to change is carried by the types rather than by a
# test: which arm a review runs on, whether a gate ruled, whether a verdict parsed.
[tool.mypy]
files = ["src"]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[[tool.mypy.overrides]]
# the sidecar's SDK ships no stubs, and its decorators are the whole surface
module = ["mcp.*", "starlette.*"]
ignore_missing_imports = true
