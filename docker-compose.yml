# robbie on a VPS.
#
# The one thing that will bite you: the orchestrator spawns SIBLING containers,
# so every `-v` it builds is resolved by the host docker daemon. `repos.bare` in
# the config must therefore be a HOST path, and it is mounted here at the exact
# same path inside the orchestrator so both agree. Change one, change the other.
#
# The network is named explicitly, not left as "<dir>_default", because the
# orchestrator passes that literal name to `docker run --network` for every
# reviewer it spawns. Rename it here and in `docker.network` together.
#
#   cp .env.example .env && edit it
#   ./scripts/mirror-sync owner/repo
#   docker compose build && docker compose up -d

services:
  robbie:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    image: robbie-orchestrator:latest
    restart: unless-stopped
    # SIGTERM finishes the tick in flight; a review can legitimately take 30 min
    stop_grace_period: 35m
    env_file: .env
    networks: [robbie]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/etc/robbie:ro
      # a named volume by default; a host path instead follows the same-path rule
      # as the mirrors, so `state_dir` means one place on both sides and the host
      # keeps its own access to the database (scripts/model-compare)
      - ${ROBBIE_STATE:-robbie-state}:${ROBBIE_STATE:-/var/lib/robbie}
      - ${ROBBIE_MIRRORS:-/srv/robbie/repos}:${ROBBIE_MIRRORS:-/srv/robbie/repos}:ro
      # same host-path rule as the mirrors: the orchestrator hands this to the
      # host daemon when it spawns a reviewer
      - ${ROBBIE_POLICY:-/opt/robbie/policy}:${ROBBIE_POLICY:-/opt/robbie/policy}:ro
      # and again for backend=oauth. /dev/null when unset, which is every
      # backend=api deployment
      - ${CLAUDE_CREDENTIALS:-/dev/null}:${CLAUDE_CREDENTIALS:-/dev/null}
    depends_on:
      reviewer-image:
        condition: service_completed_successfully

  # not a service: builds the reviewer image so `compose up` can't start the
  # orchestrator before the image its containers need exists
  reviewer-image:
    build:
      context: .
      dockerfile: Dockerfile.reviewer
      # must be the uid that owns CLAUDE_CREDENTIALS on the host: it is mounted
      # mode 600, so a mismatch fails every review on backend=oauth
      args:
        UID: ${ROBBIE_UID:-1000}
        GID: ${ROBBIE_GID:-1000}
    image: robbie-reviewer:latest
    command: ["--version"]
    entrypoint: ["claude"]
    restart: "no"

  # ---- metrics dashboard (opt in) -----------------------------------------
  #
  # Off unless asked for, because it has no auth and shows PR titles, spend and
  # whole transcripts:
  #
  #   docker compose --profile dashboard up -d      # http://127.0.0.1:4020
  #
  # Published on the loopback only. Putting it on a public interface means putting
  # an authenticating proxy in front of it first. It reads the same SQLite the
  # daemon writes (WAL, so it never blocks a review) and the same usage meters,
  # cached, so a browser refresh cannot hammer either provider.
  dashboard:
    profiles: [dashboard]
    image: robbie-orchestrator:latest
    restart: unless-stopped
    env_file: .env
    # the image's entrypoint is `robbie`, so this is its arguments, not a command
    command: ["dashboard", "--host", "0.0.0.0", "--port", "4020"]
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-4020}:4020"
    networks: [robbie]
    volumes:
      - ./config:/etc/robbie:ro
      # not :ro — SQLite needs to write the -shm file even to read a WAL database.
      # The panel's own connection is opened read-only instead, so it cannot write
      # a row whatever happens in it.
      - ${ROBBIE_STATE:-robbie-state}:${ROBBIE_STATE:-/var/lib/robbie}
      # the mirror and the policy dir are checked at boot like in any other robbie
      # process, so this one has to see the same host paths the config names
      - ${ROBBIE_MIRRORS:-/srv/robbie/repos}:${ROBBIE_MIRRORS:-/srv/robbie/repos}:ro
      - ${ROBBIE_POLICY:-/opt/robbie/policy}:${ROBBIE_POLICY:-/opt/robbie/policy}:ro
      # :ro, unlike the daemon's — the panel reads the plan meter with this token
      # and never refreshes it
      - ${CLAUDE_CREDENTIALS:-/dev/null}:${CLAUDE_CREDENTIALS:-/dev/null}:ro
    depends_on: [robbie]

  # ---- MCP sidecars -------------------------------------------------------
  #
  # Read-only context the REVIEW MODEL may pull while judging a PR: "is this
  # file throwing in prod", "is there a card describing this feature". The point
  # of a sidecar over stdio inside the reviewer image is that the token stays
  # here — the reviewer runs a model with bypassPermissions and never sees it.
  #
  # These are NOT for robbie's own Slack notifications: the orchestrator is
  # deterministic Python making one HTTP POST, and MCP would only add a
  # handshake and a service to babysit. Slack lives in slack.py.
  #
  # Off unless asked for, like the dashboard — it needs SENTRY_TOKEN and would
  # otherwise restart-loop on an install that never wanted it:
  #
  #   docker compose --profile sentry up -d
  #
  # Then point `review_mcp` in robbie.yaml at it:
  #   review_mcp: '{"mcpServers":{"sentry":{"type":"http","url":"http://mcp-sentry:8080/mcp"}}}'

  mcp-sentry:
    profiles: [sentry]
    build:
      context: .
      dockerfile: Dockerfile.mcp-sentry
    image: robbie-mcp-sentry:latest
    restart: unless-stopped
    networks: [robbie]
    environment:
      # read-only scopes (event:read, project:read) — only this service holds it
      - SENTRY_TOKEN
      - SENTRY_ORG_SLUG
      - SENTRY_PROJECTS
      # the reviewer's Host header is this service name; DNS rebinding
      # protection rejects it unless listed
      - MCP_ALLOWED_HOSTS=mcp-sentry:8080,mcp-sentry
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  robbie:
    name: robbie

volumes:
  robbie-state:
